global:
  scrape_interval: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: api-decrochage
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8000"]

  - job_name: pipeline-decrochage
    metrics_path: /pipeline/metrics
    static_configs:
      - targets: ["localhost:8000"]
