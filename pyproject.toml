[project]
name = "dropout-pred"
version = "1.0.0"
description = "Projet MLOps: prédiction du décrochage et de la réussite académique des étudiants"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "mlflow>=2.16",
    "prefect>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]
loadtest = [
    "locust>=2.29",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests", "pipelines"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
